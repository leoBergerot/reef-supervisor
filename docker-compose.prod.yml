services:
  web:
    build:
      context: .
      target: production
      args:
        REACT_APP_TURNSTILE_SITE_KEY: ${REACT_APP_TURNSTILE_SITE_KEY}
    ports:
      - "8081:80"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
