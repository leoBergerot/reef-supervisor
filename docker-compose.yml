services:
  web:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8080}
      DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
